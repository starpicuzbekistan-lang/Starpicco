<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>ATHLETE OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--bg2:#0d0e10;--card:#131518;--card2:#1a1d21;--bd:#23272c;--tx:#eceef0;--mu:#8b929a;--dim:#5b626a;--ac:#39e07f;--acd:rgba(57,224,127,.12);--warn:#f2b84b;--bad:#ff5d5d;--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;font-weight:600}
h1{font-size:28px;line-height:1.15}h3{font-size:15px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{font-family:var(--disp);font-weight:700;letter-spacing:.2em;font-size:15px;padding:4px 10px 18px}
.logo b{color:var(--ac)}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;width:100%;text-align:left}
.nav a:hover,.nav button:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:var(--card2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav svg,.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:28px clamp(16px,3vw,40px) 70px;max-width:1280px;width:100%;min-width:0}
.mtop{display:none}
.tabbar{display:none}
.banner{background:#2a2410;border:1px solid #5a4a14;color:var(--warn);padding:10px 14px;border-radius:12px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.phead p{color:var(--mu);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sp{justify-content:space-between}
.grid{display:grid;gap:16px}
.cols{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.cols4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;min-width:0}
.card.hl{border-color:#245a3a;background:linear-gradient(180deg,#112018,var(--card) 60%)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
.big{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:12px}.ac{color:var(--ac)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4047}
.btn.primary{background:var(--ac);color:#04140a;border-color:var(--ac);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#4a2326}
.btn.sm{padding:6px 10px;font-size:12px}
.ib{width:28px;height:28px;border-radius:8px;color:var(--mu);display:inline-grid;place-items:center}
.ib:hover{background:var(--card2);color:var(--tx)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.chip.ac{background:var(--acd);color:var(--ac);border-color:#245a3a}
.chip.warn{background:#2a2410;color:var(--warn);border-color:#5a4a14}
.chip.bad{background:#2a1214;color:var(--bad);border-color:#5a2326}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;border-bottom:1px solid var(--bd)}
.tabs button{padding:10px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task .tt{flex:1;min-width:0}.task .tt b{font-weight:500;display:block}.task .tt span{color:var(--mu);font-size:12px}
.task.done .tt b{color:var(--mu);text-decoration:line-through}
.task .tm{font-variant-numeric:tabular-nums;color:var(--mu);width:46px;font-size:13px}
.task.now{background:linear-gradient(90deg,var(--acd),transparent);margin:0 -18px;padding-left:18px;padding-right:18px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid #3a4047;display:grid;place-items:center;flex:none}
.chk svg{width:14px;height:14px;stroke:#04140a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--ac);border-color:var(--ac)}.chk.on svg{opacity:1}
.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.bar.w i{background:var(--warn)}
.mac{margin:10px 0}.mac .ml{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}.mac .ml span{color:var(--mu)}
.ring{position:relative;display:inline-block}.ring svg{width:100%;height:100%}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-family:var(--disp);font-size:22px}.ring .rc span{font-size:11px;color:var(--mu)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .eico{font-size:26px;color:var(--dim)}.empty b{display:block;color:var(--tx);margin:4px 0}.empty p{font-size:13px}
.safety{border:1px solid #5a2326;background:#1c1012;border-radius:14px;padding:14px 16px;font-size:13px;color:#e8c9ca;margin-bottom:16px}
.safety b{color:var(--bad)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:500}.fld em{color:var(--ac);font-style:normal}
.fld small{display:block;color:var(--dim);font-size:11px;margin-top:4px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none;margin-top:2px}
input[type=range]{padding:0;accent-color:var(--ac)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;color:var(--tx);font-size:13px;cursor:pointer}
.ferr,.merr{color:var(--bad);font-size:12px;min-height:0;margin-top:3px}
.merr{margin:6px 0 10px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:75;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.sheet.wide{width:min(760px,100%)}
.sheet h3{font-size:18px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:11px 18px;border-radius:12px;z-index:80;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.err{border-color:#5a2326;color:#ffb3b3}.toast[hidden]{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 6px;border-bottom:1px solid var(--bd)}.tbl td{padding:9px 6px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-size:12px}.chips button.on{background:var(--acd);color:var(--ac);border-color:#245a3a}
.day.today{border-color:#245a3a}
.bar.b i{background:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--card2);border:1px solid var(--bd)}.dot.on{background:var(--ac);border-color:var(--ac)}
.hg td,.hg th{text-align:center;padding:6px 2px;font-size:11px}.hg td:first-child,.hg th:first-child{text-align:left;min-width:120px;font-size:13px;position:sticky;left:0;background:var(--card)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.hrow td{padding:10px 6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos figure{position:relative;border-radius:12px;overflow:hidden;background:var(--bg2);cursor:pointer}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmpgrid figure img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.cmpgrid figcaption{font-size:12px;color:var(--mu);margin-top:4px;text-align:center}
.cmp{position:relative;aspect-ratio:3/4;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;--p:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .over{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp:after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--ac)}
.cmp input{position:absolute;left:0;right:0;bottom:8px;z-index:2;width:90%;margin:0 5%}
.pv{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-bottom:12px;background:#000}
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:24px 16px}
.onb[hidden]{display:none}
.onbwrap{width:min(560px,100%);margin:auto}
.dots{display:flex;gap:6px;margin:6px 0 22px}.dots i{height:4px;flex:1;border-radius:4px;background:var(--bd)}.dots i.on{background:var(--ac)}
.kpi{display:flex;flex-direction:column;gap:2px}
.stepn{font-size:12px;color:var(--mu)}
.tl{position:relative;height:10px;background:var(--card2);border-radius:99px;margin:26px 0 30px}
.tl i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:99px}
.tl s{position:absolute;top:-6px;width:2px;height:22px;background:#3a4047}.tl s span{position:absolute;top:24px;left:-16px;font-size:11px;color:var(--mu);text-decoration:none;width:34px;text-align:center}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
 main{padding:14px 14px 100px}
 h1{font-size:24px}
 .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(9,9,11,.92);backdrop-filter:blur(8px);z-index:20}
 .mtop .logo{padding:0}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(13,14,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--mu);text-decoration:none}
 .tabbar a.on{color:var(--ac)}.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 .cols2{grid-template-columns:1fr}
 .modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;width:100%;max-height:94vh}
 .toast{bottom:84px}
}
@media(max-width:420px){.two{grid-template-columns:1fr}.big{font-size:26px}}
</style>

.au{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}
.au[hidden]{display:none}
.au-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px 22px}
.au-box .logo{padding:0 0 14px;text-align:center}
.au-box h1{font-size:22px;text-align:center;margin-bottom:4px}
.au-box p.mu{text-align:center;margin-bottom:16px}
.au-box label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
.au-box input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px}
.au-box input:focus{outline:2px solid var(--ac);outline-offset:1px}
.au-pw{position:relative}.au-pw input{padding-right:64px}
.au-pw button{position:absolute;right:6px;top:5px;height:36px;padding:0 10px;color:var(--mu);font-size:12px}

.au-link{display:block;margin:14px auto 0;color:var(--mu);font-size:13px;text-decoration:underline}
.au-msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}
.au-msg.err{color:var(--bad)}.au-msg.ok{color:var(--ac)}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function tzNow(){const p={};tzFmt.formatToParts(new Date()).forEach(x=>{p[x.type]=x.value});return{date:p.year+'-'+p.month+'-'+p.day,min:(+p.hour)*60+(+p.minute)}}

function lineChart(series,labels,o={}){
  const W=600,H=o.h||190,pl=38,pr=12,pt=10,pb=24;
  const ys=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!ys.length)return emptyBox(o.empty||'No data yet — log an entry to see this chart.');
  let min=o.min??Math.min(...ys),max=o.max??Math.max(...ys);
  if(min===max){min-=1;max+=1}
  if(o.min==null){min-=(max-min)*.15}if(o.max==null){max+=(max-min)*.1}
  const n=labels.length,x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)),y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  let g='';
  for(let k=0;k<4;k++){const v=min+(max-min)*k/3,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#23272c" stroke-width="1"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
  const step=Math.ceil(n/6);
  for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`;
  if(o.target!=null&&o.target>=min&&o.target<=max)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="#39e07f" stroke-dasharray="4 4" opacity=".5"/>`;
  series.forEach((s,si)=>{
    let d='',open=false,pts='';
    s.vals.forEach((v,i)=>{if(v==null){open=false;return}d+=`${open?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)} `;open=true;pts+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${s.color}"><title>${esc(labels[i])}: ${fmt(v)}${o.unit||''}</title></circle>`});
    if(o.area&&si===0){const idx=s.vals.map((v,i)=>v==null?null:i).filter(i=>i!=null);if(idx.length>1)g+=`<path d="M${x(idx[0])} ${y(min)} ${idx.map(i=>`L${x(i).toFixed(1)} ${y(s.vals[i]).toFixed(1)}`).join(' ')} L${x(idx[idx.length-1])} ${y(min)}Z" fill="${s.color}" opacity=".08"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
  });
  const lg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return`${lg}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Line chart')}">${g}</svg>`;
}
function barChart(items,o={}){
  const W=600,H=o.h||160,pl=34,pr=6,pt=8,pb=22;
  const vals=items.map(i=>i.v).filter(v=>v!=null);
  if(!vals.length)return emptyBox(o.empty||'No data yet.');
  const max=o.max??Math.max(...vals,o.target||0,1);
  const bw=(W-pl-pr)/items.length,y=v=>pt+(1-v/max)*(H-pt-pb);
  let g='';
  [0,.5,1].forEach(k=>{const v=max*k,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#23272c"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`});
  const w=Math.min(bw*.66,36),step=Math.ceil(items.length/9);
  items.forEach((it,i)=>{const cx=pl+i*bw+bw/2;
    if(it.v!=null){const hh=Math.max(1,(H-pb)-y(Math.min(it.v,max)));g+=`<rect x="${cx-w/2}" y="${y(Math.min(it.v,max))}" width="${w}" height="${hh}" rx="3" fill="${it.color||o.color||'#39e07f'}" opacity="${it.v>0?1:.3}"><title>${esc(it.title||it.label)}: ${fmt(it.v)}${o.unit||''}</title></rect>`}
    if(i%step===0)g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(it.label)}</text>`});
  if(o.target!=null)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="#f2b84b" stroke-dasharray="4 4"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}</svg>`;
}
function ring(p,o={}){

  else inp=`<input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?`inputmode="decimal" step="${f.step||'any'}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}`:(f.max?`maxlength="${f.max}"`:'')} ${f.noFuture?`max="${today()}"`:''} placeholder="${esc(f.placeholder||'')}">`;
  return`<div class="fld"><label for="${id}">${f.label}${rq?' <em>*</em>':''}</label>${inp}${f.help?`<small>${f.help}</small>`:''}<div class="ferr" data-for="${f.name}"></div></div>`;
}
function readForm(form,fields){
  const vals={},errs={};
  for(const f of fields){const el=form.elements[f.name];vals[f.name]=f.type==='checkbox'?el.checked:(el.value||'').trim()}
  for(const f of fields){
    const raw=vals[f.name],req=typeof f.req==='function'?f.req(vals):f.req;
    if(f.type==='checkbox'){if(req&&!raw)errs[f.name]='This confirmation is required.';continue}
    if(raw===''){if(req)errs[f.name]='Required.';vals[f.name]=null;continue}
    if(f.type==='number'){
      const n=Number(raw);
      if(!isFinite(n)){errs[f.name]='Enter a valid number.';continue}
      if(f.min!=null&&n<f.min){errs[f.name]=`Minimum is ${f.min}.`;continue}
      if(f.max!=null&&n>f.max){errs[f.name]=`Maximum is ${f.max}.`;continue}
      if(f.int&&!Number.isInteger(n)){errs[f.name]='Enter a whole number.';continue}
      vals[f.name]=n;
    }else if(f.type==='date'){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)||isNaN(parse(raw))){errs[f.name]='Enter a valid date.'}
      else if(f.noFuture&&raw>today())errs[f.name]='Date cannot be in the future.';
    }else if(f.type==='time'){if(!/^\d{2}:\d{2}$/.test(raw))errs[f.name]='Enter a valid time.'}
    else if(f.type==='select'&&f.num)vals[f.name]=Number(raw);
    else if(f.max&&raw.length>f.max)errs[f.name]=`Max ${f.max} characters.`;
  }
  return{vals,errs};
}
function showErrs(root,errs){root.querySelectorAll('.ferr').forEach(e=>e.textContent=errs[e.dataset.for]||'');const first=Object.keys(errs)[0];if(first){const el=root.querySelector(`[name="${first}"]`);el&&el.focus&&el.focus()}}
function formModal({title,fields,submit='Save',onSubmit,extra='',intro=''}){

  const form=$('#mform');

/* ================= SMART COACH ================= */
function coach(){
  const t=today(),o={incomplete:[],flags:[],good:[],steps:[],adjust:null,week:''};
  const nowM=nowMin(),list=routineFor(t).slice().sort(byTime),dn=D(t).done;
  o.incomplete=list.filter(x=>!dn[x.id]);
  const overdue=o.incomplete.filter(x=>{const[h,m]=x.time.split(':').map(Number);return h*60+m<nowM-30});
  const ds=lastN(7).filter(d=>d>=S.start&&d<t);
  const comps=ds.map(completion).filter(x=>x!=null),a7=comps.length?Math.round(avg(comps)):null;
  const sl=lastN(7).map(d=>(D(d).rec||{}).sleep).filter(x=>x!=null),sAvg=sl.length?r1(avg(sl)):null;
  const nd=lastN(7).filter(d=>(D(d).meals||[]).length),pAvg=nd.length?Math.round(avg(nd.map(d=>nut(d).p))):null;
  const ws=weekStart(t),sess=sessionsInWeek(ws),planned=plannedPerWeek();
  o.week=`Last 7 days: routine ${a7==null?'—':a7+'%'} · sleep ${sAvg==null?'—':sAvg+' h'} · protein ${pAvg==null?'—':pAvg+' g/day'} · sessions this week ${sess}/${planned}`;
  if(a7!=null&&a7<50)o.flags.push(`Routine consistency is low (${a7}% over 7 days).`);
  if(sAvg!=null&&sAvg<sleepTarget()-1)o.flags.push(`Average sleep is ${sAvg} h, below your ${sleepTarget()} h target.`);
  if(pAvg!=null&&pAvg<.9*S.targets.protein)o.flags.push(`Protein averages ${pAvg} g/day, under your ${S.targets.protein} g target.`);
  const late=nowM>=20*60,open=n=>n.filter(i=>!dn[i.id]).length;
  if(late){const h=open(hairItems(t)),k=open(skinDue(t)),s=open(suppItems());if(h+k+s>0)o.flags.push(`Still open tonight: ${[h?h+' hair':'',k?k+' skincare':'',s?s+' supplement':''].filter(Boolean).join(', ')} item(s).`)}
  if(a7!=null&&a7>=80)o.good.push(`Strong routine consistency: ${a7}% over the last week.`);
  if(sAvg!=null&&sAvg>=sleepTarget()-.5)o.good.push(`Sleep is on target (${sAvg} h average).`);
  if(pAvg!=null&&pAvg>=.9*S.targets.protein)o.good.push(`Protein is on target (${pAvg} g/day).`);
  if(planned&&sess>=planned)o.good.push('All planned sessions logged this week.');
  overdue.slice(0,2).forEach(x=>o.steps.push(`Complete "${x.title}" — it was due at ${x.time}.`));
  if(!overdue.length&&o.incomplete.length)o.steps.push(`Next up: ${o.incomplete[0].time} ${o.incomplete[0].title}.`);
  const n=nut(t);
  if(!(D(t).meals||[]).length)o.steps.push('Log your first meal so protein can be tracked today.');
  else if(n.p<S.targets.protein*.7&&nowM>17*60)o.steps.push(`Protein is ${Math.round(n.p)} g so far. Add a protein-rich meal or snack.`);
  if((D(t).water||0)<S.targets.water*.5&&nowM>14*60)o.steps.push('Water is under half of target. Drink a glass now.');
  if(!(D(t).rec&&D(t).rec.sleep!=null))o.steps.push('Log last night’s sleep in Recovery.');
  if(!S.metrics.some(m=>m.date>=addDays(t,-14)))o.steps.push('Log weight and measurements (none in 14 days).');
  o.steps=o.steps.slice(0,4);
  const h=S.goals.habit;
  if(comps.length>=5){
    if(a7<50&&h>60)o.adjust={v:Math.max(60,h-10),msg:`Consistency is ${a7}%. Set a more realistic habit target of ${Math.max(60,h-10)}% for next week and rebuild from there.`};
    else if(a7>=h+5&&h<95)o.adjust={v:Math.min(95,h+5),msg:`You beat your ${h}% habit target (${a7}%). Raise it to ${Math.min(95,h+5)}%?`};
  }
  return o;
}

function coachHtml(c){

}

function historyHtml(n){
  const ws=S.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);

  return`<div class="list">${ws.map(w=>`<div><div class="row sp"><b>${esc(w.name)}</b><span class="row"><span class="mu sm">${fmtDate(w.date)}${w.dur?' · '+w.dur+' min':''}</span><button class="ib" data-act="wk-del" data-id="${w.id}" aria-label="Delete">✕</button></span></div>${w.exs.map(x=>`<div class="mu sm">${x.done===false?'○':'✓'} ${esc(x.name)} — ${x.sets.map(s=>`${s.reps}×${s.w}kg`).join(', ')}</div>`).join('')}${w.notes?`<div class="sm" style="margin-top:4px">“${esc(w.notes)}”</div>`:''}</div>`).join('')}</div>`;
}
function progressHtml(){
  if(!S.workouts.length)return`<div class="card">${empty('No training data yet','Log workouts to see strength progression, personal records and volume.')}</div>`;
  const names=[...new Set(S.workouts.flatMap(w=>w.exs.map(x=>x.name)))].sort();
  if(!ui.progEx||!names.includes(ui.progEx))ui.progEx=names[0];
  const sess=S.workouts.filter(w=>w.exs.some(x=>x.name===ui.progEx&&x.sets.length)).sort((a,b)=>a.date.localeCompare(b.date));
  const vals=sess.map(w=>Math.max(...w.exs.find(x=>x.name===ui.progEx).sets.map(s=>s.w)));
  const P=prs(),weeks=[];for(let i=7;i>=0;i--)weeks.push(weekStart(addDays(today(),-i*7)));
  const vol=weeks.map(ws=>({label:ws.slice(5),v:Math.round(sum(S.workouts.filter(w=>w.date>=ws&&w.date<=addDays(ws,6)).map(w=>sum(w.exs.map(x=>sum(x.sets.map(s=>s.reps*s.w))))))),title:'Week of '+ws}));
  const ses=weeks.map(ws=>({label:ws.slice(5),v:sessionsInWeek(ws)}));
  const cut=addDays(today(),-30),mu={};
  S.workouts.filter(w=>w.date>=cut).forEach(w=>w.exs.forEach(x=>{const k=x.muscle||muscleOf(x.name);mu[k]=(mu[k]||0)+x.sets.length}));
  const mm=[...MUSCLES,'Other'].map(m=>({label:m.slice(0,5),v:mu[m]||0,title:m}));
  const durs=S.workouts.filter(w=>w.dur).map(w=>w.dur);
  return`<div class="grid cols2"><div class="card"><div class="hd"><h3>Strength progression</h3><select style="max-width:230px" data-chg="progEx" aria-label="Exercise">${names.map(n=>`<option ${n===ui.progEx?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${lineChart([{name:'Top set (kg)',color:'#39e07f',vals}],sess.map(w=>w.date.slice(5)),{unit:' kg',area:true})}</div>
  <div class="card"><div class="hd"><h3>Weekly training volume (kg)</h3></div>${barChart(vol,{h:170,unit:' kg'})}</div>
  <div class="card"><div class="hd"><h3>Sessions per week</h3></div>${barChart(ses,{h:150,target:plannedPerWeek()||undefined})}${durs.length?`<p class="mu sm">Average logged duration: ${Math.round(avg(durs))} min</p>`:''}</div>
  <div class="card"><div class="hd"><h3>Sets per muscle group (30 days)</h3></div>${barChart(mm,{h:150,unit:' sets'})}</div></div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>Personal records</h3></div><div class="scroll"><table class="tbl"><tr><th>Exercise</th><th>Best set</th><th>Date</th></tr>${Object.entries(P).sort().map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.w?v.w+' kg':'Bodyweight'} × ${v.reps}</td><td>${fmtDate(v.date)}</td></tr>`).join('')}</table></div></div>`;
}

function saveLogger(){
  collectLogger();const err=m=>{$('#mErr').textContent=m};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(W.date)||W.date>today())return err('Choose a valid date that is not in the future.');
  let dur=null;const ds=String(W.dur).trim();
  if(ds!==''){dur=Number(ds);if(!Number.isInteger(dur)||dur<1||dur>600)return err('Duration must be a whole number of minutes (1–600).')}
  else{const m=Math.round((Date.now()-W.t0)/60000);if(m>=5&&m<=600)dur=m}
  const exs=[];
  for(const x of W.exs){const sets=[];for(const s of x.sets){if(String(s.reps).trim()==='')continue;const r=Number(s.reps),w=String(s.w).trim()===''?0:Number(s.w);
    if(!Number.isInteger(r)||r<1||r>300)return err(`${x.name}: reps must be a whole number from 1 to 300.`);
    if(!isFinite(w)||w<0||w>500)return err(`${x.name}: weight must be 0–500 kg.`);sets.push({reps:r,w})}
    if(sets.length)exs.push({name:x.name,muscle:muscleOf(x.name),done:!!x.done,sets})}
  if(!exs.length)return err('Enter reps for at least one set.');
  S.workouts.push({id:uid(),date:W.date,name:W.name,tid:W.tid,dur,warm:W.warm,cool:W.cool,exs,notes:W.notes.trim().slice(0,300)});
  W=null;closeModal();commit();toast('Workout saved');
}

function periodStats(a,b){
  const ds=[];for(let d=a;d<=b;d=addDays(d,1))ds.push(d);
  const ws=S.workouts.filter(w=>w.date>=a&&w.date<=b),wt=S.metrics.filter(x=>x.weight!=null&&x.date>=a&&x.date<=b);
  const comp=ds.map(completion).filter(x=>x!=null),sl=ds.map(d=>(D(d).rec||{}).sleep).filter(x=>x!=null),du=ws.filter(w=>w.dur).map(w=>w.dur);
  return{sess:ws.length,vol:Math.round(sum(ws.map(w=>sum(w.exs.map(x=>sum(x.sets.map(s=>s.reps*s.w))))))),dur:du.length?Math.round(avg(du)):null,wt:wt.length?r1(avg(wt.map(x=>x.weight))):null,comp:comp.length?Math.round(avg(comp)):null,sleep:sl.length?r1(avg(sl)):null,nut:ds.filter(nutOK).length};
}
function monthlyBody(){
  const t=today(),m0=monthOf(t),ms=[];for(let i=11;i>=0;i--)ms.push(addMonths(m0,-i));
  const st=ms.map(m=>periodStats(mFirst(m),mLast(m)>t?t:mLast(m)));
  const yrs=[...new Set([t.slice(0,4),...S.workouts.map(w=>w.date.slice(0,4)),...S.metrics.map(x=>x.date.slice(0,4)),...Object.keys(S.days).map(d=>d.slice(0,4))])].filter(y=>/^\d{4}$/.test(y)).sort();
  const ys=yrs.map(y=>[y,periodStats(y+'-01-01',y+'-12-31'>t?t:y+'-12-31')]);
  const lb=ms.map(m=>m.slice(2));
  return`<div class="grid cols2"><div class="card"><div class="hd"><h3>Sessions per month</h3></div>${barChart(ms.map((m,i)=>({label:m.slice(5),v:st[i].sess,title:monthName(m)})),{h:150,empty:'Log workouts to see monthly totals.'})}</div>
  <div class="card"><div class="hd"><h3>Training volume per month (kg)</h3></div>${barChart(ms.map((m,i)=>({label:m.slice(5),v:st[i].vol,title:monthName(m)})),{h:150,unit:' kg'})}</div>
  <div class="card"><div class="hd"><h3>Average weight per month</h3></div>${lineChart([{name:'Weight',color:'#39e07f',vals:st.map(x=>x.wt)}],lb,{unit:' kg',area:true,empty:'Log weight to see monthly averages.'})}</div>
  <div class="card"><div class="hd"><h3>Routine completion per month</h3></div>${barChart(ms.map((m,i)=>({label:m.slice(5),v:st[i].comp,title:monthName(m)})),{h:150,max:100,unit:'%'})}</div></div>
  <div class="card scroll" style="margin-top:16px"><div class="hd"><h3>Month by month</h3></div><table class="tbl"><tr><th>Month</th><th>Sessions</th><th>Volume</th><th>Avg min</th><th>Avg weight</th><th>Routine</th><th>Sleep</th></tr>${ms.map((m,i)=>[m,st[i]]).reverse().map(([m,x])=>`<tr><td>${monthName(m)}</td><td>${x.sess}</td><td>${x.vol?x.vol+' kg':'—'}</td><td>${x.dur??'—'}</td><td>${x.wt!=null?x.wt+' kg':'—'}</td><td>${x.comp!=null?x.comp+'%':'—'}</td><td>${x.sleep!=null?x.sleep+' h':'—'}</td></tr>`).join('')}</table></div>
  <div class="card scroll" style="margin-top:16px"><div class="hd"><h3>Year by year</h3></div><table class="tbl"><tr><th>Year</th><th>Sessions</th><th>Volume</th><th>Avg weight</th><th>Routine</th><th>Nutrition days on target</th></tr>${ys.reverse().map(([y,x])=>`<tr><td>${y}</td><td>${x.sess}</td><td>${x.vol?x.vol+' kg':'—'}</td><td>${x.wt!=null?x.wt+' kg':'—'}</td><td>${x.comp!=null?x.comp+'%':'—'}</td><td>${x.nut}</td></tr>`).join('')}</table><p class="mu sm" style="margin-top:8px">Everything is calculated from your recorded data. There is no end date and nothing resets when a week, month or year changes.</p></div>`;
}

  <div class="grid cols2" style="margin-top:16px">
  <div class="card"><div class="hd"><h3>Daily habit completion</h3></div>${barChart(comp,{max:100,target:S.goals.habit,unit:'%',empty:'No routine data in this range.'})}</div>

  <div class="card"><div class="hd"><h3>Nutrition adherence (protein % of target)</h3></div>${barChart(nutr,{target:100,unit:'%',max:150,empty:'Log meals to see adherence.'})}</div>
  <div class="card"><div class="hd"><h3>Sleep duration & quality</h3></div>${lineChart([{name:'Hours',color:'#39e07f',vals:ds.map(d=>R(d).sleep??null)}],lb,{unit:' h',target:sleepTarget(),empty:'Log sleep in Recovery.'})}${lineChart([{name:'Quality (1–5)',color:'#f2b84b',vals:ds.map(d=>R(d).sq??null)}],lb,{min:1,max:5,h:130,empty:''})}</div>
  <div class="card"><div class="hd"><h3>Body weight trend</h3></div>${lineChart([{name:'Weight',color:'#39e07f',vals:m.map(x=>x.weight??null)}],m.map(x=>x.date.slice(5)),{unit:' kg',area:true,empty:'Log weight in Measurements.'})}</div>
  <div class="card scroll"><div class="hd"><h3>Measurement changes</h3></div><table class="tbl"><tr><th>Metric</th><th>First</th><th>Latest</th><th>Change</th></tr>${chg}</table></div>
  <div class="card"><div class="hd"><h3>Skin & hair routine consistency</h3></div>${barChart(app,{max:100,unit:'%',empty:'Tick skin and hair items to see consistency.'})}</div>
  <div class="card"><div class="hd"><h3>Supplement consistency</h3></div>${barChart(sup,{max:100,unit:'%',empty:'Add supplements and tick them off.'})}</div></div>

}

function lsKeys(prefix){const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(prefix))o.push(k)}}catch(e){}return o}

/* ---------- Finance ---------- */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const monthOf=d=>d.slice(0,7);
const daysInM=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const addMonths=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mFirst=m=>m+'-01',mLast=m=>m+'-'+pad(daysInM(m));
const monthName=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
function money(v,c){const d=c==='UZS'?0:2;const n=Number(v)||0;return(n<0?'−':'')+new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.abs(n))+' '+c}
const shortNum=v=>v>=1e9?r1(v/1e9)+'B':v>=1e6?r1(v/1e6)+'M':v>=1e3?r1(v/1e3)+'k':String(Math.round(v*100)/100);
const fcur=()=>ui.finCur||S.fin.cur;
const fmonth=()=>ui.finMonth||monthOf(today());
const txOf=(cur,a,b,type)=>S.fin.tx.filter(x=>(!cur||x.cur===cur)&&(!a||x.date>=a)&&(!b||x.date<=b)&&(!type||x.type===type));
const amt=l=>r2(sum(l.map(x=>x.amount)));
const newest=(a,b)=>b.date.localeCompare(a.date);
function totals(cur,a,b){const i=amt(txOf(cur,a,b,'income')),e=amt(txOf(cur,a,b,'expense'));return{inc:i,exp:e,net:r2(i-e),rate:i>0?Math.round((i-e)/i*100):null}}
const balance=cur=>r2((S.fin.start[cur]||0)+totals(cur).net);
const balanceAt=(cur,date)=>r2((S.fin.start[cur]||0)+totals(cur,null,date).net);
function rateTo(from,to){if(from===to)return 1;const pick=(f,t)=>{const l=S.fin.rates.filter(r=>r.from===f&&r.to===t).sort((a,b)=>a.date.localeCompare(b.date));return l.length?l[l.length-1].rate:null};const d=pick(from,to);if(d!=null)return d;const i=pick(to,from);return i!=null?1/i:null}
function combined(def){let tot=0;const miss=[];CURS.forEach(c=>{const used=(S.fin.start[c]||0)!==0||S.fin.tx.some(x=>x.cur===c);if(!used)return;const r=rateTo(c,def);if(r==null)miss.push(c);else tot+=balance(c)*r});return{tot:r2(tot),miss}}
function budgetFor(cat,cur,m){let best=null;S.fin.budgets.forEach(b=>{if(b.cat===cat&&b.cur===cur&&b.from<=m&&(!best||b.from>=best.from))best=b});return best&&best.limit!=null?best:null}
function budgetList(cur,m){const set=new Set();S.fin.budgets.forEach(b=>{if(b.cur===cur&&b.from<=m)set.add(b.cat)});return[...set].map(c=>budgetFor(c,cur,m)).filter(Boolean).sort((a,b)=>(a.cat==='ALL'?-1:b.cat==='ALL'?1:a.cat.localeCompare(b.cat)))}
const spentIn=(cat,cur,m)=>amt(txOf(cur,mFirst(m),mLast(m),'expense').filter(x=>cat==='ALL'||x.cat===cat));
const curChips=()=>`<div class="chips">${CURS.map(c=>`<button class="${fcur()===c?'on':''}" data-act="fin-cur" data-c="${c}">${c}</button>`).join('')}</div>`;
const monthNav=()=>{const m=fmonth();return`<div class="row"><button class="btn sm" data-act="fin-month" data-n="-1" aria-label="Previous month">‹</button><b>${monthName(m)}</b><button class="btn sm" data-act="fin-month" data-n="1" ${m>=monthOf(today())?'disabled':''} aria-label="Next month">›</button></div>`};
function groupBars(labels,A,B,o={}){
  const n=labels.length;if(!n||![...A,...B].some(v=>v>0))return emptyBox(o.empty||'No income or expenses in this period.');
  const W=600,H=o.h||180,pl=44,pr=6,pt=8,pb=22,max=Math.max(...A,...B,1),bw=(W-pl-pr)/n,y=v=>pt+(1-v/max)*(H-pt-pb);
  let g='';[0,.5,1].forEach(k=>{const v=max*k,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#23272c"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${shortNum(v)}</text>`});
  const w=Math.min(bw*.34,22),step=Math.ceil(n/8);
  labels.forEach((l,i)=>{const cx=pl+i*bw+bw/2;
    [[A[i],'#39e07f',-w,'Income'],[B[i],'#f2b84b',0,'Expenses']].forEach(([v,c,off,nm])=>{if(v>0)g+=`<rect x="${cx+off}" y="${y(v)}" width="${w}" height="${Math.max(1,H-pb-y(v))}" rx="3" fill="${c}"><title>${esc(l)} ${nm}: ${shortNum(v)}</title></rect>`});
    if(i%step===0)g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  return`<div class="legend"><span><i style="background:#39e07f"></i>Income</span><span><i style="background:#f2b84b"></i>Expenses</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income versus expenses">${g}</svg>`;
}

}
const catBars=(entries,cur)=>{const tot=sum(entries.map(e=>e[1]))||1;return entries.map(([k,v])=>`<div class="mac"><div class="ml"><span>${esc(k)}</span><b>${money(v,cur)} · ${Math.round(v/tot*100)}%</b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`).join('')};
const budBar=(sp,lim)=>{const p=lim>0?sp/lim*100:0;return`<div class="bar ${p>100?'b':p>=80?'w':''}"><i style="width:${clamp(p,0,100)}%"></i></div>`};

function buckets(a,b){
  const n=diffDays(a,b)+1,out=[];
  if(n<=45){for(let d=a;d<=b;d=addDays(d,1))out.push({l:d.slice(8),f:d,t:d,title:fmtDate(d)})}
  else if(n<=200){let w=weekStart(a);while(w<=b){const e=addDays(w,6);out.push({l:w.slice(5),f:w<a?a:w,t:e>b?b:e,title:'Week of '+w});w=addDays(w,7)}}
  else{let m=monthOf(a);while(m<=monthOf(b)){out.push({l:m.slice(2),f:mFirst(m),t:mLast(m),title:monthName(m)});m=addMonths(m,1)}}
  return out;
}
function finAnalytics(){
  const t=today(),cur=fcur(),[a,b0]=finRangeOf(),b=b0>t?t:b0;
  const ranges=[['week','This week'],['month','This month'],['last','Last month'],['3m','Last 3 months'],['year','This year'],['custom','Custom range']];
  const head=`${curChips()}<div class="row" style="margin-bottom:14px"><select style="width:auto" data-chg="finRange" aria-label="Period">${ranges.map(r=>`<option value="${r[0]}" ${ui.finRange===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select>${ui.finRange==='custom'?`<input type="date" style="width:auto" value="${ui.finFrom||a}" data-chg="finFrom" aria-label="From"><input type="date" style="width:auto" value="${ui.finTo||b0}" data-chg="finTo" aria-label="To">`:''}<span class="mu sm">${a} → ${b0} · ${cur} only (currencies are never mixed)</span></div>`;
  if(a>b)return head+`<div class="card">${empty('This period has not started yet')}</div>`;
  const tx=txOf(cur,a,b);
  if(!tx.length)return head+`<div class="card">${empty('No '+cur+' transactions in this period','Charts appear once you record income or expenses with dates in this range.')}</div>`;
  const ex=tx.filter(x=>x.type==='expense'),days=Math.max(1,diffDays(a,b)+1),tot=totals(cur,a,b);
  const bk=buckets(a,b),eb=bk.map(k=>({label:k.l,v:amt(ex.filter(x=>x.date>=k.f&&x.date<=k.t)),title:k.title}));
  const months=[];for(let m=monthOf(a);m<=monthOf(b);m=addMonths(m,1))months.push(m);
  const ml=months.slice(-12),mt=ml.map(m=>totals(cur,mFirst(m),mLast(m)));
  const years=[...new Set(S.fin.tx.filter(x=>x.cur===cur).map(x=>x.date.slice(0,4)))].sort().slice(-6),yt=years.map(y=>totals(cur,y+'-01-01',y+'-12-31'));
  const cats={};ex.forEach(x=>{cats[x.cat]=(cats[x.cat]||0)+x.amount});const ce=Object.entries(cats).sort((p,q)=>q[1]-p[1]);
  const trendM=ml,bal=trendM.map(m=>balanceAt(cur,mLast(m)>t?t:mLast(m)));
  const expLbl=bk.length>45?'':'';
  return`${head}<div class="kp"><div class="card"><div class="eyebrow">Income</div><div class="big ac">${money(tot.inc,cur)}</div></div><div class="card"><div class="eyebrow">Expenses</div><div class="big">${money(tot.exp,cur)}</div></div><div class="card"><div class="eyebrow">Net savings</div><div class="big ${tot.net<0?'bad':''}">${money(tot.net,cur)}</div></div><div class="card"><div class="eyebrow">Avg daily expenses</div><div class="big">${money(r2(tot.exp/days),cur)}</div><div class="mu sm">over ${days} day${days>1?'s':''}</div></div></div>
  <div class="grid cols2" style="margin-top:16px"><div class="card"><div class="hd"><h3>Expenses over time</h3></div>${barChart(eb,{h:170,empty:'No expenses in this period.'})}<div class="mu sm">${bk.length&&diffDays(a,b)+1<=45?'Daily':diffDays(a,b)+1<=200?'Weekly':'Monthly'} totals in ${cur}</div></div>
  <div class="card"><div class="hd"><h3>Monthly income vs expenses</h3></div>${groupBars(ml.map(m=>m.slice(2)),mt.map(x=>x.inc),mt.map(x=>x.exp))}</div>
  <div class="card"><div class="hd"><h3>Yearly income vs expenses</h3></div>${groupBars(years,yt.map(x=>x.inc),yt.map(x=>x.exp))}</div>
  <div class="card"><div class="hd"><h3>Spending by category</h3></div>${ce.length?catBars(ce,cur):empty('No expenses in this period')}</div>
  <div class="card"><div class="hd"><h3>Savings trend (balance at month end)</h3></div>${lineChart([{name:'Balance',color:'#39e07f',vals:bal}],trendM.map(m=>m.slice(2)),{area:true,unit:' '+cur})}</div>
  <div class="card"><div class="hd"><h3>Monthly savings rate (%)</h3></div>${lineChart([{name:'Savings rate',color:'#39e07f',vals:mt.map(x=>x.rate)}],ml.map(m=>m.slice(2)),{unit:'%',empty:'Needs income in at least one month.'})}</div>
  <div class="card"><div class="hd"><h3>Highest spending categories</h3></div>${ce.length?`<table class="tbl">${ce.slice(0,5).map(([k,v],i)=>`<tr><td class="mu">${i+1}</td><td>${esc(k)}</td><td style="text-align:right">${money(v,cur)}</td></tr>`).join('')}</table>`:empty('No expenses in this period')}</div></div>`;
}

const ALIAS={metrics:['progress','measures'],analytics:['progress','overview'],transformation:['progress','monthly']};
function getRoute(){let r=(location.hash||'').replace(/^#\/?/,'');if(ALIAS[r]){ui.tab.progress=ALIAS[r][1];r=ALIAS[r][0]}return VIEWS[r]?r:'dashboard'}
function render(){
  route=getRoute();
  let h;try{h=VIEWS[route]()}catch(e){console.error('Render error:',e&&e.message);h=`<div class="card">${empty('Something went wrong',esc(e&&e.message))}</div>`}
  $('#view').innerHTML=h;
  $('#banner').innerHTML=(LOAD_ERR?`<div class="banner"><span>${esc(LOAD_ERR)}</span></div>`:'')+(dateOverride?`<div class="banner"><span>Simulating ${dateOverride} (testing). Anything you log is saved under that date.</span><button class="btn sm" data-act="date-clear">Back to real date</button></div>`:'');
  const link=(r,l)=>`<a href="#/${r}" class="${r===route?'on':''}">${ico(r)}<span>${l}</span></a>`;
  $('#sidenav').innerHTML=NAV.map(n=>link(n[0],n[1])).join('');
  $('#tabbar').innerHTML=['dashboard','routine','training','nutrition'].map(r=>`<a href="#/${r}" class="${r===route?'on':''}">${ico(r)}<span>${NAV.find(n=>n[0]===r)[1].split(' ')[0]}</span></a>`).join('')+`<button data-act="more">${ico('more')}<span>More</span></button>`;

}

function mergeStarter(o){

  const has=(a,n)=>a.some(x=>String(x.name).toLowerCase()===n.toLowerCase());let n=0;
  arr(o.hairProducts,[]).forEach(p=>{if(isObj(p)&&typeof p.name==='string'&&p.name.trim()&&!has(S.hair.products,p.name)){const slots=arr(p.slots,[]).filter(k=>['am','pm','day'].includes(k));S.hair.products.push({id:'hp_'+uid(),active:true,name:p.name.slice(0,80),kind:String(p.kind||'Topical').slice(0,30),brand:String(p.brand||'').slice(0,60),ingredients:String(p.ingredients||'').slice(0,600),dose:String(p.dose||'').slice(0,120),slots:slots.length?slots:['am']});n++}});
  arr(o.supplements,[]).forEach(p=>{if(isObj(p)&&typeof p.name==='string'&&p.name.trim()&&!has(S.supps,p.name)){S.supps.push({id:'su_'+uid(),active:true,name:p.name.slice(0,80),brand:String(p.brand||'').slice(0,60),dose:String(p.dose||'').slice(0,80),timing:String(p.timing||'').slice(0,60),withFood:!!p.withFood,hair:!!p.hair,note:String(p.note||'').slice(0,500)});n++}});

}

function procPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return rej('Please choose an image file.');
    if(file.size>25e6)return rej('Image is larger than 25 MB.');
    const fr=new FileReader();fr.onerror=()=>rej('Could not read the file.');
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Could not decode the image.');im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

}

  if(k==='hair')return toCSV([['date','condition','shedding_observed','notes'],...S.hair.entries.map(e=>[e.date,e.cond,e.shed,e.notes])]);
  if(k==='recovery')return toCSV([['date','sleep_h','sleep_quality','energy','fatigue','soreness','rest_day'],...ds.filter(d=>D(d).rec).map(d=>{const r=D(d).rec;return[d,r.sleep,r.sq,r.energy,r.fatigue,r.sore,r.restDay?1:0]})]);

function onRestoreFile(e){
  const file=e.target.files[0];if(!file)return;
  const fr=new FileReader();fr.onerror=()=>toast('Could not read the file.','err');
  fr.onload=()=>{try{
    const o=JSON.parse(fr.result),data=isObj(o)&&isObj(o.data)?o.data:o;
    if(!isObj(data)||!isObj(data.profile)||!isObj(data.days)||!Array.isArray(data.workouts))throw new Error('This does not look like an ATHLETE OS backup.');
    const n=migrate(JSON.parse(JSON.stringify(data))),pd=isObj(o.photoData)?o.photoData:{};
    confirmBox(`Replace ALL current data with this backup (${n.workouts.length} workouts, ${n.fin.tx.length} transactions, ${Object.keys(pd).length} photos)? A safety copy of your current data is kept first, and photos already on this device are kept.`,()=>doRestore(n,pd),'Restore');
  }catch(err){toast(err.message||'Invalid backup file.','err')}};
  fr.readAsText(file);
}
async function doRestore(n,pd){
  try{localStorage.setItem(BK.imp,JSON.stringify(S))}catch(x){}
  const old=S.photos;S=n;S.onboarded=true;
  for(const p of S.photos){const src=pd[p.id]||p.data;if(src){PH[p.id]=src;delete p.data;if(!(await idbPut(p.id,src)))p.data=src}}
  S.photos=S.photos.filter(p=>p.data||PH[p.id]);
  old.forEach(p=>{if(!S.photos.some(q=>q.id===p.id)&&(p.data||PH[p.id]))S.photos.push(p)});
  save();if(!needsOnboarding())$('#onb').hidden=true;render();toast('Backup restored');
}

function txFields(type,t){
  const base=type==='income'?S.fin.catsIn:S.fin.catsEx,cats=t&&!base.includes(t.cat)?[...base,t.cat]:base;
  return[{name:'amount',label:'Amount',type:'number',min:0.01,max:1e13,req:true,val:t?t.amount:'',step:'any'},
   {name:'cur',label:'Currency',type:'select',opts:CURS.map(c=>[c,c]),val:t?t.cur:S.fin.cur},
   ...(type==='income'?[{name:'source',label:'Income source',type:'text',max:60,req:true,val:t?t.source:''}]:[]),
   {name:'cat',label:'Category',type:'select',opts:cats.map(c=>[c,c]),val:t?t.cat:cats[0]},
   {name:'date',label:'Date',type:'date',req:true,noFuture:true,val:t?t.date:today()},
   ...(type==='expense'?[{name:'method',label:'Payment method',type:'select',opts:PAYM.map(c=>[c,c]),val:t?t.method:'Cash'}]:[]),
   {name:'desc',label:'Description (optional)',type:'text',max:120,val:t?t.desc:''},
   {name:'notes',label:'Notes (optional)',type:'textarea',max:300,val:t?t.notes:''}];
}
function txObj(type,v,id){return{id:id||uid(),type,amount:r2(v.amount),cur:v.cur,cat:v.cat,source:type==='income'?(v.source||''):'',date:v.date,method:type==='expense'?(v.method||''):'',desc:v.desc||'',notes:v.notes||''}}
ACT['tx-add']=d=>formModal({title:d.type==='income'?'Add income':'Add expense',fields:txFields(d.type,null),onSubmit:v=>{S.fin.tx.push(txObj(d.type,v));ui.finCur=v.cur;commit();toast('Saved')}});
ACT['tx-edit']=d=>{const t=S.fin.tx.find(x=>x.id===d.id);if(t)formModal({title:'Edit '+t.type,fields:txFields(t.type,t),onSubmit:v=>{Object.assign(t,txObj(t.type,v,t.id));commit()}})};
ACT['tx-del']=d=>{const t=S.fin.tx.find(x=>x.id===d.id);if(t)confirmBox(`Delete this ${t.type} of ${money(t.amount,t.cur)} (${t.date})? Balances and charts update; nothing else is changed.`,()=>{S.fin.tx=S.fin.tx.filter(x=>x.id!==d.id);commit()},'Delete')};
/* budgets */
const budCats=()=>[['ALL','Overall monthly limit'],...S.fin.catsEx.map(c=>[c,c])];
function upsertBudget(cat,cur,limit){const m=fmonth(),e=S.fin.budgets.find(b=>b.cat===cat&&b.cur===cur&&b.from===m);if(e)e.limit=limit;else S.fin.budgets.push({id:uid(),cat,cur,limit,from:m})}
ACT['budget-add']=()=>formModal({title:'Set monthly budget',intro:'Applies from '+monthName(fmonth())+' onward. Earlier months keep their previous limits.',fields:[{name:'cat',label:'Applies to',type:'select',opts:budCats(),val:'ALL'},{name:'cur',label:'Currency',type:'select',opts:CURS.map(c=>[c,c]),val:fcur()},{name:'limit',label:'Monthly limit',type:'number',min:1,max:1e13,req:true}],onSubmit:v=>{upsertBudget(v.cat,v.cur,r2(v.limit));ui.finCur=v.cur;commit()}});
ACT['budget-edit']=d=>{const b=budgetFor(d.cat,fcur(),fmonth());if(b)formModal({title:'Edit budget',intro:'Applies from '+monthName(fmonth())+' onward.',fields:[{name:'limit',label:'Monthly limit ('+b.cur+')',type:'number',min:1,max:1e13,req:true,val:b.limit}],onSubmit:v=>{upsertBudget(b.cat,b.cur,r2(v.limit));commit()}})};
ACT['budget-del']=d=>confirmBox('Remove this budget from '+monthName(fmonth())+' onward? Earlier months keep their history.',()=>{upsertBudget(d.cat,fcur(),null);commit()},'Remove');
/* goals */
const goalFields=(g,locked)=>[{name:'name',label:'Goal name',type:'text',req:true,max:60,val:g?g.name:'',placeholder:'e.g. Emergency fund'},{name:'cur',label:'Currency',type:'select',opts:CURS.map(c=>[c,c]),val:g?g.cur:S.fin.cur},{name:'target',label:'Target amount',type:'number',min:1,max:1e13,req:true,val:g?g.target:''},...(g?[]:[{name:'saved',label:'Already saved (optional)',type:'number',min:0,max:1e13,val:0}]),{name:'date',label:'Target date (optional)',type:'date',val:g?g.date:''},{name:'desc',label:'Description (optional)',type:'textarea',max:300,val:g?g.desc:''}];
ACT['goal-add']=()=>formModal({title:'New savings goal',fields:goalFields(null),onSubmit:v=>{const g={id:uid(),name:v.name,cur:v.cur,target:r2(v.target),date:v.date||'',desc:v.desc||'',log:[]};if(v.saved>0)g.log.push({id:uid(),date:today(),amt:r2(v.saved),note:'Opening amount'});S.fin.goals.push(g);commit()}});
ACT['goal-edit']=d=>{const g=S.fin.goals.find(x=>x.id===d.id);if(!g)return;const f=goalFields(g);if(g.log.length)f[1]={name:'cur',label:'Currency (locked once money is recorded)',type:'select',opts:[[g.cur,g.cur]],val:g.cur};formModal({title:'Edit goal',fields:f,onSubmit:v=>{Object.assign(g,{name:v.name,cur:g.log.length?g.cur:v.cur,target:r2(v.target),date:v.date||'',desc:v.desc||''});commit()}})};
ACT['goal-del']=d=>confirmBox('Delete this goal and its record of added money? Your balances are not affected.',()=>{S.fin.goals=S.fin.goals.filter(g=>g.id!==d.id);commit()},'Delete');
ACT['goal-money']=d=>{const g=S.fin.goals.find(x=>x.id===d.id);if(!g)return;const add=d.dir==='add';
  formModal({title:(add?'Add money to ':'Withdraw from ')+esc(g.name),fields:[{name:'amount',label:'Amount ('+g.cur+')',type:'number',min:0.01,max:1e13,req:true},{name:'date',label:'Date',type:'date',req:true,noFuture:true,val:today()},{name:'note',label:'Note (optional)',type:'text',max:80}],
  onSubmit:v=>{const a=r2(v.amount);if(!add&&a>goalSaved(g))return'You can withdraw at most '+money(goalSaved(g),g.cur)+'.';g.log.push({id:uid(),date:v.date,amt:add?a:-a,note:v.note||''});commit()}})};
/* settings */
ACT['fin-start']=()=>formModal({title:'Starting balances',intro:'What you already had before you began tracking. Kept separate from income.',fields:CURS.map(c=>({name:c,label:c,type:'number',min:-1e13,max:1e13,val:S.fin.start[c]||0})),onSubmit:v=>{CURS.forEach(c=>{S.fin.start[c]=r2(v[c]||0)});commit()}});
ACT['fin-convert']=()=>{S.fin.convert=!S.fin.convert;commit()};
ACT['rate-add']=()=>formModal({title:'Add exchange rate',intro:'Manual rate. Old rates are kept as history.',fields:[{name:'from',label:'From',type:'select',opts:CURS.map(c=>[c,c]),val:'USD'},{name:'to',label:'To',type:'select',opts:CURS.map(c=>[c,c]),val:'UZS'},{name:'rate',label:'1 unit of “From” equals',type:'number',min:0.000001,max:1e9,req:true},{name:'date',label:'Date',type:'date',req:true,noFuture:true,val:today()}],onSubmit:v=>{if(v.from===v.to)return'Choose two different currencies.';S.fin.rates.push({id:uid(),from:v.from,to:v.to,rate:v.rate,date:v.date});commit()}});
const catList=k=>k==='in'?S.fin.catsIn:S.fin.catsEx;
const catNameField=v=>[{name:'name',label:'Category name',type:'text',req:true,max:40,val:v||''}];
ACT['cat-add']=d=>formModal({title:'Add category',fields:catNameField(),onSubmit:v=>{const l=catList(d.kind);if(l.some(c=>c.toLowerCase()===v.name.toLowerCase()))return'That category already exists.';l.push(v.name);commit()}});
ACT['cat-ren']=d=>{const l=catList(d.kind),old=l[+d.i];formModal({title:'Rename category',intro:'Existing transactions and budgets using it are updated too.',fields:catNameField(old),onSubmit:v=>{if(v.name!==old&&l.some(c=>c.toLowerCase()===v.name.toLowerCase()))return'That category already exists.';l[+d.i]=v.name;S.fin.tx.forEach(x=>{if(x.cat===old&&x.type===(d.kind==='in'?'income':'expense'))x.cat=v.name});if(d.kind==='ex')S.fin.budgets.forEach(b=>{if(b.cat===old)b.cat=v.name});commit()}})};
ACT['cat-del']=d=>{const l=catList(d.kind),old=l[+d.i];confirmBox(`Delete “${esc(old)}”? Transactions using it move to “Other”.`,()=>{const type=d.kind==='in'?'income':'expense';S.fin.tx.forEach(x=>{if(x.cat===old&&x.type===type)x.cat='Other'});if(d.kind==='ex')S.fin.budgets.forEach(b=>{if(b.cat===old)b.cat='Other'});l.splice(+d.i,1);if(!l.includes('Other'))l.push('Other');commit()},'Delete')};
ACT['fin-export']=()=>{dl(`athlete-os-finance-${today()}.json`,'application/json',JSON.stringify({app:'ATHLETE OS',kind:'finance',schema:SCHEMA,exported:new Date().toISOString(),fin:S.fin}));toast('Finance data exported')};
ACT['fin-import']=()=>{const f=$('#finimp');f.value='';f.click()};
function onFinImport(e){const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onerror=()=>toast('Could not read the file.','err');
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!isObj(o)||o.kind!=='finance'||!isObj(o.fin)||!Array.isArray(o.fin.tx))throw new Error('This is not an ATHLETE OS finance export.');
    const n=migrate({...JSON.parse(JSON.stringify(S)),fin:o.fin}).fin;
    confirmBox(`Replace your finance data with this file (${n.tx.length} transactions)? A safety copy of your current data is kept first.`,()=>{try{localStorage.setItem(BK.imp,JSON.stringify(S))}catch(x){}S.fin=n;commit();toast('Finance data imported')},'Import')}catch(err){toast(err.message||'Invalid file.','err')}};fr.readAsText(f)}
/* ================= CHANGE / INPUT HANDLERS ================= */
const CHG={
  sched:(v,el)=>{S.schedule[+el.dataset.wd]=v;commit()},
  cmp:(v,el)=>{ui.cmp[el.dataset.cat]=Object.assign(ui.cmp[el.dataset.cat]||{},{[el.dataset.side]:v});render()},
  progEx:v=>{ui.progEx=v;render()},
  anRange:v=>{ui.anRange=+v;render()},
  ftx:(v,el)=>{ui.fTx[el.dataset.k]=v;ui.fTxN=100;render()},
  finRange:v=>{ui.finRange=v;render()},finFrom:v=>{ui.finFrom=v;render()},finTo:v=>{ui.finTo=v;render()},
  fincur:v=>{if(CURS.includes(v)){S.fin.cur=v;ui.finCur=null;commit()}}
};
const INP={exq:v=>{ui.exQuery=v;render()},foodq:v=>{ui.foodQ=v;render()},ftxq:v=>{ui.fTx.q=v;ui.fTxN=100;render()}};
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('click',e=>{
    if(e.target.id==='modal'){if(!W)closeModal();return}
    const t=e.target.closest('[data-act]');if(!t)return;
    const a=ACT[t.dataset.act];if(a){if(t.tagName==='A'&&t.dataset.act==='close'){closeModal();return}a(t.dataset,t,e)}
  });
  document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t.value,t)});
  let inT;
  document.addEventListener('input',e=>{
    const sl=e.target.closest('[data-slide]');if(sl){sl.parentElement.style.setProperty('--p',sl.value+'%');return}
    const t=e.target.closest('[data-inp]');if(!t)return;const k=t.dataset.inp;clearTimeout(inT);
    inT=setTimeout(()=>{INP[k](t.value);const n=document.querySelector(`[data-inp="${k}"]`);if(n){n.focus();const l=n.value.length;n.setSelectionRange&&n.setSelectionRange(l,l)}},250);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){W=null;closeModal()}});
  $('#file').addEventListener('change',onPhotoFile);$('#restore').addEventListener('change',onRestoreFile);
  $('#starter').addEventListener('change',onStarterFile);$('#finimp').addEventListener('change',onFinImport);
}
/* ================= ONBOARDING ================= */
let O={step:0};
function onbSteps(){return[
  {t:'Welcome to ATHLETE OS',intro:'Your permanent personal system for training, hair care, skincare, supplements, finance and habits. Everything stays on this device, and you only do this setup once.',fields:[{name:'name',label:'Name (optional)',type:'text',max:40,val:S.profile.name},{name:'age',label:'Age',type:'number',min:14,max:90,int:true,req:true,val:S.profile.age},{name:'height',label:'Height (cm)',type:'number',min:120,max:230,req:true,val:S.profile.height},{name:'weight',label:'Current weight (kg)',type:'number',min:30,max:250,step:.1,req:true,val:S.profile.weight},{name:'wake',label:'Wake time',type:'time',req:true,val:S.profile.wake},{name:'bed',label:'Target bedtime',type:'time',req:true,val:S.profile.bed}],
   save:v=>Object.assign(S.profile,v)},
  {t:'Nutrition targets',intro:'Editable starting estimates for steady, healthy muscle gain. Protein reference: about 1.6–2.0 g per kg of body weight. Change them any time.',fields:tgtFields(S.targets),save:v=>Object.assign(S.targets,v)},
  {t:'Finance basics (optional)',intro:'Choose a default currency and, if you like, what you already have today. You can skip the balances and edit them later in Finance → Settings.',fields:[{name:'cur',label:'Default currency',type:'select',opts:CURS.map(c=>[c,c]),val:S.fin.cur},...CURS.map(c=>({name:c,label:'Starting balance '+c,type:'number',min:-1e13,max:1e13,val:S.fin.start[c]||''}))],save:v=>{S.fin.cur=v.cur;CURS.forEach(c=>{S.fin.start[c]=r2(v[c]||0)})},last:true}
]}
function startOnboarding(){O.step=0;onbDraw()}
function onbDraw(){
  const st=onbSteps(),s=st[O.step];
  $('#onb').hidden=false;
  $('#onb').innerHTML=`<div class="onbwrap"><div class="logo" style="padding-left:0">ATHLETE <b>OS</b></div><div class="dots">${st.map((_,i)=>`<i class="${i<=O.step?'on':''}"></i>`).join('')}</div><div class="stepn">Step ${O.step+1} of ${st.length}</div><h1 style="margin:4px 0 8px">${s.t}</h1><p class="mu" style="margin-bottom:18px">${s.intro}</p>${LOAD_ERR?`<div class="banner">${esc(LOAD_ERR)}</div>`:''}
  <form id="oform" novalidate>${s.fields.map(fieldHtml).join('')}<div class="merr" id="mErr"></div><div class="row sp">${O.step>0?'<button type="button" class="btn ghost" id="oBack">Back</button>':'<span></span>'}<span class="row">${s.last?'<button type="button" class="btn" id="oStarter">Import starter file</button><button type="button" class="btn" id="oRestore">Restore backup</button>':''}<button class="btn primary">${s.last?'Start ATHLETE OS':'Continue'}</button></span></div></form></div>`;
  const form=$('#oform');
  form.onsubmit=e=>{e.preventDefault();const{vals,errs}=readForm(form,s.fields);showErrs(form,errs);if(Object.keys(errs).length)return;
    s.save(vals);
    if(s.last){S.onboarded=true;if(!Object.keys(S.days).length)S.start=today();if(!save())return;$('#onb').hidden=true;location.hash='#/dashboard';render()}else{O.step++;save();onbDraw();window.scrollTo&&window.scrollTo(0,0)}};
  const b=$('#oBack');if(b)b.onclick=()=>{O.step--;onbDraw()};
  const si=$('#oStarter');if(si)si.onclick=()=>ACT['starter-import']();
  const rs=$('#oRestore');if(rs)rs.onclick=()=>ACT.restore();
}
function boot(){
  if(needsOnboarding())startOnboarding();
  render();
  idbOpen().then(async ok=>{if(ok){await idbLoadAll();await migratePhotos();render()}});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
/* ================= AUTH (Supabase) =================
   Fill in the two values below. Use the Project URL WITHOUT /rest/v1 and the
   PUBLISHABLE (anon) key only. Never put a secret or service_role key here. */
const SUPABASE_URL='https://cofhzrwkskzfymmeiefs.supabase.co';            // e.g. https://abcdefgh.supabase.co
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_CBLYWKKmLYD5KSWoSKhqxA_gRTyHPAA'; // e.g. sb_publishable_... or the legacy anon key
let sb=null,APP_STARTED=false,AUTH_MODE='in';
const auEl=()=>$('#au');
function auShow(html){document.body.classList.add('locked');const a=auEl();a.innerHTML=html;a.hidden=false}
function auMsg(t,k){const m=$('#auMsg');if(m){m.textContent=t||'';m.className='au-msg '+(k||'')}}
const AU_LOGO='<div class="logo">ATHLETE <b>OS</b></div>';
function auLoading(t){auShow('<div class="au-box">'+AU_LOGO+'<p class="au-spin">'+(t||'Loading…')+'</p></div>')}
function authErr(e){
  const m=String(e&&e.message||e||'');
  if(/invalid login|invalid credentials/i.test(m))return 'Incorrect email or password.';
  if(/email not confirmed/i.test(m))return 'This email is not confirmed yet. Confirm it in Supabase, then try again.';
  if(/rate limit|too many/i.test(m))return 'Too many attempts. Wait a minute and try again.';
  if(/failed to fetch|network|load failed/i.test(m))return 'Cannot reach Supabase. Check your connection and the Project URL.';
  return m||'Something went wrong.';
}
function pwField(id,ph,ac){return '<div class="au-pw"><input id="'+id+'" type="password" autocomplete="'+ac+'" placeholder="'+ph+'" required><button type="button" data-pw="'+id+'">Show</button></div>'}
function showSignIn(note){
  AUTH_MODE='in';
  auShow('<form class="au-box" id="auForm" novalidate>'+AU_LOGO+'<h1>Sign in</h1><p class="mu sm">Private app. Accounts are created by the owner.</p>'+
   '<label for="auEmail">Email</label><input id="auEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" required>'+
   '<label for="auPw">Password</label>'+pwField('auPw','Your password','current-password')+
   '<button class="au-go" id="auGo" type="submit">Sign in</button><button type="button" class="au-link" id="auForgot">Forgot password?</button>'+
   '<div class="au-msg" id="auMsg" role="status"></div></form>');
  if(note)auMsg(note,'err');
}
function showRecovery(){
  AUTH_MODE='rec';
  auShow('<form class="au-box" id="auForm" novalidate>'+AU_LOGO+'<h1>Set a new password</h1><p class="mu sm">At least 8 characters.</p>'+
   '<label for="auPw">New password</label>'+pwField('auPw','New password','new-password')+
   '<button class="au-go" id="auGo" type="submit">Save password</button><div class="au-msg" id="auMsg" role="status"></div></form>');
}
function showConfigError(){
  auShow('<div class="au-box">'+AU_LOGO+'<h1>Setup needed</h1><p class="mu sm">Add your Supabase Project URL and publishable key to <b>SUPABASE_URL</b> and <b>SUPABASE_PUBLISHABLE_KEY</b> near the end of index.html, then redeploy.</p></div>');
}
function startApp(){
  if(APP_STARTED)return;APP_STARTED=true;
  boot();
  const so=document.createElement('button');so.className='btn sm';so.id='signout';so.type='button';so.textContent='Sign out';
  so.style.cssText='margin:auto 6px 4px';
  $('.side').appendChild(so);
  const mt=$('.mtop');if(mt){const b=so.cloneNode(true);b.id='signoutM';b.style.cssText='margin-left:8px';mt.appendChild(b)}
}
async function doSignOut(){try{await sb.auth.signOut()}catch(e){toast(authErr(e),'err')}}
function onSession(session,event){
  if(event==='PASSWORD_RECOVERY'){showRecovery();return}
  if(AUTH_MODE==='rec')return;
  if(session){auEl().hidden=true;document.body.classList.remove('locked');startApp()}
  else{
    const expired=APP_STARTED&&event!=='SIGNED_OUT';
    if(APP_STARTED){location.reload();return} // clean reset of in-memory state after sign-out
    showSignIn(expired?'Your session expired. Please sign in again.':'')
  }
}
function initAuth(){
  if(!SUPABASE_URL||!SUPABASE_PUBLISHABLE_KEY||!window.supabase){
    if(!window.supabase&&SUPABASE_URL){auShow('<div class="au-box">'+AU_LOGO+'<h1>Cannot load sign-in</h1><p class="mu sm">The Supabase library failed to load. Check your connection and reload.</p></div>');return}
    showConfigError();return;
  }
  try{sb=window.supabase.createClient(SUPABASE_URL.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,''),SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
  catch(e){auShow('<div class="au-box">'+AU_LOGO+'<h1>Setup error</h1><p class="mu sm">'+authErr(e)+'</p></div>');return}
  auLoading('Checking session…');
  sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>onSession(session,event),0)});
  sb.auth.getSession().then(({data,error})=>{
    if(error)showSignIn(authErr(error));
    else if(!data.session&&!APP_STARTED&&AUTH_MODE==='in'&&!location.hash.includes('type=recovery'))showSignIn();
  }).catch(e=>showSignIn(authErr(e)));
  document.addEventListener('click',e=>{
    const pw=e.target.closest('[data-pw]');
    if(pw){const i=document.getElementById(pw.dataset.pw);const h=i.type==='password';i.type=h?'text':'password';pw.textContent=h?'Hide':'Show';return}
    if(e.target.closest('#auForgot')){forgot();return}
    if(e.target.closest('#signout,#signoutM'))doSignOut();
  });
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='auForm')return;e.preventDefault();
    const go=$('#auGo');go.disabled=true;auMsg('');
    try{
      if(AUTH_MODE==='rec'){
        const pw=$('#auPw').value;if(pw.length<8)throw new Error('Password must be at least 8 characters.');
        const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;
        history.replaceState(null,'',location.pathname);AUTH_MODE='in';auMsg('Password updated.','ok');
        const {data}=await sb.auth.getSession();onSession(data.session,'SIGNED_IN');
      }else{
        const email=$('#auEmail').value.trim(),pw=$('#auPw').value;
        if(!email||!pw)throw new Error('Enter your email and password.');
        const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
        auMsg('Signed in…','ok');
      }
    }catch(err){auMsg(authErr(err),'err');go.disabled=false}
  });
}
async function forgot(){
  const email=($('#auEmail')||{}).value;
  if(!email||!email.trim()){auMsg('Enter your email above first.','err');return}
  auMsg('Sending…');
  try{const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;auMsg('If that account exists, a reset link was sent.','ok')}
  catch(err){auMsg(authErr(err),'err')}
}
if(typeof document!=='undefined'&&!(typeof window!=='undefined'&&window.__TEST__)){
  if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  document.body.classList.add('locked');initAuth();
}
